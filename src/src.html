<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Readiness Score · Bluluma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, confident business advisor — Bluluma Editorial Refined
   IDEA: a consultant's diagnostic report, filled in live
   PICTURE: the quiz card itself, then a large score ring
   COLOUR and TYPE: warm paper, ink, Bluluma blue #5887da; Instrument Serif + Inter, Noto Serif/Sans TC for 中文
   LAYOUT: one calm column, progress rule on top, report sections below */
:root{color-scheme:light dark;
--bg:light-dark(#f6f3ee,#0f1418);--card:light-dark(#fffdf9,#161d23);--ink:light-dark(#17202a,#ece7df);
--mute:light-dark(#5d6670,#9aa3ab);--line:light-dark(#e2ddd4,#2a333b);--acc:light-dark(#2f5fb3,#7fa6ea);
--accs:light-dark(#e9effa,#1b2a3b);--warn:light-dark(#9a3b2a,#e0907f);
--serif:"Instrument Serif",Georgia,serif;--sans:Inter,system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root[lang=zh-Hant]{--serif:"Noto Serif TC","Instrument Serif",serif;--sans:Inter,"Noto Sans TC",system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);overflow-x:clip}
:root[lang=zh-Hant] body{line-height:1.75}
.wrap{max-width:760px;margin:0 auto;padding:clamp(18px,3vw,36px) max(5vw,16px) 64px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:36px}
.logo{height:52px;width:auto;display:block}.lg-d{display:none}
:root[data-theme=dark] .lg-l{display:none}:root[data-theme=dark] .lg-d{display:block;height:34px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .lg-l{display:none}:root:not([data-theme=light]) .lg-d{display:block;height:34px}}
.lang{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--mute);font:500 14px var(--sans);padding:0 14px;min-height:40px;cursor:pointer}
.lang button.on{background:var(--ink);color:var(--bg)}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.08;text-wrap:balance;margin:0}
:root[lang=zh-Hant] :is(h1,h2,h3){font-weight:500;line-height:1.3}
h1{font-size:clamp(34px,6vw,52px)}h2{font-size:clamp(26px,4.5vw,36px)}h3{font-size:23px}
:root[lang=zh-Hant] h1{font-size:clamp(30px,5.4vw,46px)}
em{font-style:italic;color:var(--acc)}:root[lang=zh-Hant] em{font-style:normal}
p{margin:.6em 0}.lead{font-size:18px;color:var(--mute);max-width:60ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:clamp(20px,4vw,36px);margin-top:20px}
.btn{appearance:none;border:0;border-radius:4px;background:var(--acc);color:var(--card);font:600 16px var(--sans);padding:14px 22px;min-height:48px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,textarea:focus-visible,.lang button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:24px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:28px}
.facts div{border-top:1px solid var(--line);padding-top:10px;font-size:14px;color:var(--mute)}
.facts b{display:block;font-size:22px;color:var(--ink);font-family:var(--serif);font-weight:400}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin:6px 0 18px}
.prog i{display:block;height:100%;background:var(--acc);transition:width .35s}
.qhead{display:flex;justify-content:space-between;gap:12px;color:var(--mute);font-size:14px}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{text-align:left;background:transparent;border:1px solid var(--line);border-radius:4px;padding:14px 16px;min-height:52px;font:16px var(--sans);color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--acc)}.opt.on{border-color:var(--acc);background:var(--accs)}
.chips{grid-template-columns:repeat(2,minmax(0,1fr))}
label{display:block;font-size:14px;color:var(--mute);margin:16px 0 6px}
input,textarea{width:100%;font:16px var(--sans);padding:13px 14px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);min-height:48px}
textarea{min-height:90px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:15px;margin-top:12px;cursor:pointer}
.check input{width:20px;height:20px;min-height:0;margin-top:3px;flex:none;accent-color:var(--acc)}
.small{font-size:13px;color:var(--mute)}
.score{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:center}
.ring{position:relative;width:200px;height:200px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:400 64px "Instrument Serif",serif}
.ring small{position:absolute;left:0;bottom:46px;width:100%;text-align:center;color:var(--mute);font-size:13px}
.bars{display:grid;gap:14px;margin-top:8px}
.bar .t{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.bar .tr{height:8px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--acc)}
.bar.low .tr i{background:var(--warn)}
.locked{position:relative}.locked .blur{filter:blur(7px);user-select:none;pointer-events:none;max-height:900px;overflow:hidden}
.pay{position:absolute;inset:0;display:grid;place-items:center;padding:16px}
.pay .card{max-width:420px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.12)}
.price{font:400 56px "Instrument Serif",serif;line-height:1}
ul.tick{padding:0;list-style:none;text-align:left;margin:16px 0}
ul.tick li{padding:7px 0 7px 26px;position:relative;border-bottom:1px solid var(--line);font-size:15px}
ul.tick li::before{content:"";position:absolute;left:4px;top:15px;width:10px;height:6px;border:2px solid var(--acc);border-top:0;border-right:0;transform:rotate(-45deg)}
.pillar{border-top:1px solid var(--line);padding:20px 0}
.pillar .lvl{font-size:14px;color:var(--mute)}
.plan{display:grid;gap:12px}
.plan div{display:grid;grid-template-columns:90px minmax(0,1fr);gap:14px;border-top:1px solid var(--line);padding-top:12px}
.plan b{font-family:var(--serif);font-weight:400;font-size:20px;color:var(--acc)}
.pkg{border:1px solid var(--acc);background:var(--accs)}
.pkg .name{font-size:14px;color:var(--acc);font-weight:600}
.cta{background:var(--acc);color:var(--card);border:0}
.cta h2 em{color:inherit;opacity:.85}.cta .btn{background:var(--card);color:var(--acc)}
.cta .small,.cta label{color:inherit;opacity:.85}.cta .check{color:inherit}
.cta textarea{background:var(--card)}
.cta ul.tick li{border-color:rgba(255,255,255,.25)}.cta ul.tick li::before{border-color:currentColor}
.spin{width:44px;height:44px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite;margin:10px auto 18px}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}.prog i{transition:none}}
@media(max-width:600px){.logo{height:40px}.score{grid-template-columns:1fr;justify-items:center;text-align:center}.facts{grid-template-columns:1fr}.chips{grid-template-columns:1fr}.plan div{grid-template-columns:1fr;gap:2px}.pay{align-items:start;padding-top:40px}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a href="https://bluluma.com" aria-label="Bluluma Design"><img class="logo lg-l" src="{{LOGO}}" alt="Bluluma Design"><img class="logo lg-d" src="{{LOGOW}}" alt="Bluluma Design"></a>
  <div class="lang" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="zh">中文</button></div>
</header>

<section id="v-intro">
  <h1 data-h="h1"></h1>
  <p class="lead" data-t="intro"></p>
  <div class="facts"><div><b data-t="f1b"></b><span data-t="f1"></span></div><div><b data-t="f2b"></b><span data-t="f2"></span></div><div><b data-t="f3b"></b><span data-t="f3"></span></div></div>
  <div class="row"><button class="btn" id="start" data-t="start"></button><span class="small" id="resume"></span></div>
</section>

<section id="v-quiz" hidden>
  <div class="qhead"><span id="qsec"></span><span id="qnum"></span></div>
  <div class="prog"><i id="bar"></i></div>
  <div class="card">
    <h2 id="qtext"></h2>
    <div class="opts" id="opts"></div>
    <div class="row"><button class="btn ghost" id="back" data-t="back"></button></div>
  </div>
</section>

<section id="v-lead" hidden>
  <h2 data-h="leadh"></h2>
  <p class="lead" data-t="leadp"></p>
  <form class="card" id="leadform">
    <label for="fname" data-t="fname"></label><input id="fname" autocomplete="given-name" required>
    <label for="biz" data-t="biz"></label><input id="biz" autocomplete="organization" required>
    <label for="email" data-t="email"></label><input id="email" type="email" autocomplete="email" required>
    <label for="site" data-t="site"></label><input id="site" type="text" inputmode="url" autocapitalize="off" spellcheck="false" autocomplete="url" placeholder="https://yourbusiness.com">
    <label class="check"><input type="checkbox" id="nosite"><span data-t="nosite"></span></label>
    <div class="row"><button class="btn" type="submit" data-t="see"></button></div>
    <p class="small" data-t="nospam"></p>
  </form>
</section>

<section id="v-load" hidden class="card" style="text-align:center">
  <div class="spin"></div><h3 id="loadmsg"></h3>
</section>

<section id="v-result" hidden>
  <div class="score">
    <div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="10"/><circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="var(--acc)" stroke-width="10" stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="327"/></svg><b id="num">0</b><small data-t="of100"></small></div>
    <div><p class="small" id="rname"></p><h1 id="tier"></h1><p class="lead" id="tierdesc"></p></div>
  </div>
  <div class="card"><h3 data-t="five"></h3><div class="bars" id="bars"></div></div>
  <div class="locked" id="lockwrap">
    <div class="blur" id="report"></div>
    <div class="pay" id="paybox">
      <div class="card">
        <h3 data-t="unlockh"></h3>
        <p class="small" data-t="unlockp"></p>
        <div class="price">$2.99</div><p class="small" data-t="once"></p>
        <ul class="tick" id="paylist"></ul>
        <button class="btn" id="unlock" style="width:100%" data-t="unlockb"></button>
        <p class="small" data-t="demo"></p>
      </div>
    </div>
  </div>
</section>
</div>

const TXT={

 lead:[["Slow replies and missed calls are likely your most expensive leak. Many people contact the business that answers first.","回覆太慢和錯過來電，很可能是你最昂貴的漏洞。很多客人會選擇最先回覆的那一家。"],["You respond reasonably, but not instantly. Automatic replies and a missed-call text-back would close the gap.","你的回覆速度還可以，但不是即時。自動回覆和未接來電自動短訊就能補上這個缺口。"],["You capture and answer leads well. A connected pipeline can help you follow up at scale.","你接收和回覆查詢做得很好。串連好的銷售流程能讓你大規模跟進。"]],
 ops:[["A large part of your week goes to work a system could do. Every hour of admin is an hour not spent on customers or growth.","你每週有一大部分時間花在系統本可代勞的工作上。每一小時的行政，都是少了一小時照顧客人或發展生意。"],["Some of your admin is streamlined, but your tools still need you in the middle. Connecting them is the next win.","部分行政已經簡化，但工具之間仍然要靠你來回處理。把它們串連起來就是下一個突破。"],["Your operations are lean. Look for the last manual handoffs and automate them.","你的營運很精簡。找出最後幾個人手交接的地方，把它們自動化。"]],

 data:[["Ask every new customer how they found you, and log it","問每位新客人怎樣找到你，並記錄下來"],["Pick 3 numbers to watch weekly: leads, bookings, revenue","每週追蹤 3 個數字：查詢、預約、營業額"],["Put those numbers on one live dashboard","把這些數字放在一個即時 dashboard 上"]]};
const HRS=[12,7.5,3.5,1];
const ALL=[...PROFILE.map(p=>({sec:0,q:p.q,o:p.o,chips:p.chips})),...Q.map(([k,q,o])=>({sec:P.find(p=>p.k===k).n,q,o,k}))];
let S={i:0,a:[],lead:{},paid:false,req:null,lang:null};
try{const s=JSON.parse(localStorage.getItem("bl-air2")||"null");if(s&&Array.isArray(s.a))S=Object.assign(S,s)}catch(e){}
if(!S.lang)S.lang=(navigator.language||"").toLowerCase().startsWith("zh")?"zh":"en";
const save=()=>{try{localStorage.setItem("bl-air2",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),t=k=>T[S.lang][k],L=x=>Array.isArray(x)?x[S.lang==="en"?0:1]:x;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let view="intro";
const show=v=>{view=v;["intro","quiz","lead","load","result"].forEach(x=>$("v-"+x).hidden=x!==v);window.scrollTo(0,0)};
function applyLang(){
  document.documentElement.lang=S.lang==="en"?"en":"zh-Hant";
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===S.lang));
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll("[data-h]").forEach(e=>e.innerHTML=t(e.dataset.h));
  $("paylist").innerHTML=t("pay").map(x=>`<li>${x}</li>`).join("");
  $("resume").textContent=S.a.length&&S.a.length<ALL.length?t("resume"):"";
  if(view==="quiz")render();if(view==="result")result();
}
document.querySelector(".lang").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.lang=b.dataset.l;save();applyLang()};
function render(){
  const q=ALL[S.i];$("qsec").textContent=q.sec===0?t("about"):L(q.sec);$("qnum").textContent=(S.i+1)+t("of")+ALL.length;
  $("bar").style.width=(S.i/ALL.length*100)+"%";$("qtext").textContent=L(q.q);
  $("opts").className="opts"+(q.chips?" chips":"");
  $("opts").innerHTML=q.o.map((o,j)=>`<button class="opt${S.a[S.i]===j?" on":""}" data-j="${j}">${L(o)}</button>`).join("");
  $("back").disabled=S.i===0;
}
$("start").onclick=()=>{if(S.a.length>=ALL.length&&S.lead.email){show("result");result();return}S.i=Math.min(S.a.length,ALL.length-1);show("quiz");render()};
$("opts").onclick=e=>{const b=e.target.closest(".opt");if(!b)return;S.a[S.i]=+b.dataset.j;save();
  [...$("opts").children].forEach(c=>c.classList.toggle("on",c===b));
  setTimeout(()=>{if(S.i<ALL.length-1){S.i++;save();render()}else{$("bar").style.width="100%";show("lead")}},220)};
$("back").onclick=()=>{if(S.i>0){S.i--;render()}};
$("nosite").onchange=e=>{$("site").disabled=e.target.checked;if(e.target.checked)$("site").value=""};
$("leadform").onsubmit=e=>{e.preventDefault();
  let site=$("site").value.trim();if(site&&!/^https?:\/\//i.test(site))site="https://"+site;
  S.lead={name:$("fname").value.trim(),biz:$("biz").value.trim(),email:$("email").value.trim(),site,nosite:$("nosite").checked};save();
  show("load");const m=t("load");let k=0;$("loadmsg").textContent=m[0];
  const tm=setInterval(()=>{k++;if(k<m.length)$("loadmsg").textContent=m[k];else{clearInterval(tm);show("result");result(true)}},900)};
function calc(){
  const off=PROFILE.length,sc={};
  P.forEach(p=>{let s=0,n=0;Q.forEach(([k],j)=>{if(k===p.k){s+=S.a[off+j]||0;n+=3}});sc[p.k]=Math.round(s/n*100)});
  const total=Math.round(P.reduce((a,p)=>a+sc[p.k],0)/P.length);
  return{sc,total,hrs:HRS[S.a[off+6]||0],ind:PROFILE[0].o[S.a[0]||0]};
}
const lvl=v=>v<40?0:v<75?1:2;
function result(anim){
  const r=calc(),ti=TIERS.reduce((a,x,i)=>r.total>=x[0]?i:a,0),tr=TIERS[ti],nm=L([tr[1],tr[2]]);
  $("rname").textContent=(S.lead.biz||"")+" · "+L(r.ind);
  $("tier").innerHTML=esc(nm[0])+(S.lang==="en"?" ":"")+"<em>"+esc(nm[1])+"</em>";$("tierdesc").textContent=L(tr[3]);
  let n=anim&&!matchMedia("(prefers-reduced-motion: reduce)").matches?0:r.total;
  const step=()=>{n=Math.min(r.total,n+2);$("num").textContent=n;$("arc").style.strokeDashoffset=327-327*n/100;if(n<r.total)requestAnimationFrame(step)};step();
  $("bars").innerHTML=P.map(p=>`<div class="bar${r.sc[p.k]<40?" low":""}"><div class="t"><span>${L(p.n)}</span><b>${r.sc[p.k]}</b></div><div class="tr"><i style="width:${Math.max(r.sc[p.k],3)}%"></i></div></div>`).join("");
  const order=[...P].sort((a,b)=>r.sc[a.k]-r.sc[b.k]),top=order.slice(0,3),pk=PKG[ti],wk=i=>S.lang==="en"?t("week")+" "+i:t("week")+" "+i+" 週";
  const hasSite=S.lead.site&&!S.lead.nosite;
  $("report").innerHTML=`
  <div class="card"><h2>${t("gaps")}</h2>
   ${top.map((p,i)=>`<div class="pillar"><p class="lvl">${t("gap")} ${i+1} · ${L(p.n)} · ${r.sc[p.k]}/100</p><p>${L(TXT[p.k][lvl(r.sc[p.k])])}</p></div>`).join("")}
   <div class="pillar"><p class="lvl">${t("time")}</p><p>${t("timep")(r.hrs,Math.round(r.hrs*48))}</p></div></div>
  <div class="card"><h2>${t("plan")}</h2><div class="plan">
   ${top.map((p,i)=>`<div><b>${wk(i+1)}</b><span><strong>${L(p.n)}.</strong> ${ACT[p.k].slice(0,2).map(L).join(S.lang==="en"?". ":"；")}${S.lang==="en"?".":"。"}</span></div>`).join("")}
   <div><b>${wk(4)}</b><span><strong>${t("lock")}</strong> ${L(ACT[top[0].k][2])}${S.lang==="en"?". ":"。"}${t("retake")}</span></div></div></div>
  <div class="card"><h2>${t("all")}</h2>${order.map(p=>`<div class="pillar"><p class="lvl">${L(p.n)} · ${r.sc[p.k]}/100</p><p>${L(TXT[p.k][lvl(r.sc[p.k])])}</p><p class="small">${t("quick")}${ACT[p.k].map(L).join(" · ")}</p></div>`).join("")}</div>
  <div class="card pkg"><p class="name">${t("pkgh")}</p><h2>Bluluma ${L(pk[0])}</h2><p class="small">${t("pkgp")}</p><ul class="tick">${pk[1].map(x=>`<li>${L(x)}</li>`).join("")}</ul></div>
  <div class="card cta" id="cta">${S.req?`<h2>${t("done")}</h2><p>${t("donep")(esc(S.lead.email))}</p><p class="small">${t("demo2")}</p>`:`
   <h2>${t("ctah")}</h2><p>${t(hasSite?"ctap1":"ctap0")}</p>${hasSite?`<p class="small">${esc(S.lead.site)}</p>`:""}
   <form id="reqform"><label class="check"><input type="checkbox" id="consent"><span>${t("ctac")}</span></label>
   <label for="notes">${t("notes")}</label><textarea id="notes"></textarea>
   <div class="row"><button class="btn" type="submit">${t("ctab")}</button></div><p class="small" id="reqmsg" aria-live="polite"></p></form>
   <p class="small">${t("ctas")}</p>`}</div>`;
  const f=$("reqform");if(f)f.onsubmit=e=>{e.preventDefault();if(!$("consent").checked){$("reqmsg").textContent=t("need");return}
    S.req={at:new Date().toISOString(),notes:$("notes").value.trim(),pkg:pk[0][0],score:r.total};save();result()};
  if(S.paid)unlock();
}
function unlock(){S.paid=true;save();$("report").classList.remove("blur");$("paybox").hidden=true;$("lockwrap").classList.remove("locked")}
$("unlock").onclick=()=>{unlock();$("report").scrollIntoView({behavior:"smooth"})};
applyLang();
}
</script>
