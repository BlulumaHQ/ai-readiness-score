:root{color-scheme:light dark;

:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}

*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);overflow-x:clip}
:root[lang=zh-Hant] body{line-height:1.75}
.wrap{max-width:480px;margin:0 auto;padding:0 18px 120px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px}
.hrow{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.logo{height:34px;width:auto;display:block;margin:0 auto}.lg-d{display:none}
:root[data-theme=dark] .lg-l{display:none}:root[data-theme=dark] .lg-d{display:block;height:24px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .lg-l{display:none}:root:not([data-theme=light]) .lg-d{display:block;height:24px}}
.icon{width:44px;height:44px;border:0;background:transparent;color:var(--ink);cursor:pointer;border-radius:50%;display:grid;place-items:center}
.icon[disabled]{visibility:hidden}
.langb{font:600 13px var(--sans);color:var(--mute)}
.segs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:10px}
.segs i{height:4px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
.segs i b{position:absolute;inset:0;background:var(--acc);transform-origin:left;transform:scaleX(var(--f,0));transition:transform .5s ease}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.08;text-wrap:balance;margin:0}
:root[lang=zh-Hant] :is(h1,h2,h3){font-weight:500;line-height:1.3}
h1{font-size:clamp(34px,9vw,44px)}h2{font-size:clamp(26px,7vw,32px)}h3{font-size:22px}
:root[lang=zh-Hant] h1{font-size:clamp(28px,8vw,38px)}:root[lang=zh-Hant] h2{font-size:clamp(23px,6.4vw,28px)}
em{font-style:italic;color:var(--acc)}:root[lang=zh-Hant] em{font-style:normal}
p{margin:.6em 0}.lead{font-size:17px;color:var(--mute)}
.small{font-size:13px;color:var(--mute)}
.center{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px;margin-top:18px}
.btn{appearance:none;border:0;border-radius:6px;background:var(--acc);color:var(--onacc);font:600 16px var(--sans);padding:14px 22px;min-height:52px;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,textarea:focus-visible,.icon:focus-visible,.flip:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(transparent,var(--bg) 30%);padding:24px 18px calc(16px + env(safe-area-inset-bottom))}
.dock .btn{display:block;max-width:444px;margin:0 auto}
.screen{animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:22px 0 6px}
.hero-strip img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center top;border-radius:6px;border:1px solid var(--line)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}
.facts div{border-top:1px solid var(--line);padding-top:8px;font-size:13px;color:var(--mute)}
.facts b{display:block;font-size:22px;color:var(--ink);font-family:"Instrument Serif",serif;font-weight:400}
.qsec{font-size:13px;color:var(--acc);font-weight:600;margin-top:18px}
.cheer{font-size:13px;color:var(--mute);min-height:20px}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-height:56px;font:16px var(--sans);color:var(--ink);cursor:pointer;transition:border-color .15s,transform .15s}
.opt:hover{border-color:var(--acc)}.opt.on{border-color:var(--acc);background:var(--accs);transform:scale(.99)}
.chips{grid-template-columns:repeat(2,minmax(0,1fr))}.chips .opt{font-size:15px;min-height:64px}
label{display:block;font-size:14px;color:var(--mute);margin:16px 0 6px}
input,textarea{width:100%;font:16px var(--sans);padding:13px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-height:50px}
textarea{min-height:90px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:15px;margin-top:12px;cursor:pointer}
.check input{width:20px;height:20px;min-height:0;margin-top:3px;flex:none;accent-color:var(--acc)}
.done{width:96px;height:96px;margin:30px auto 18px;display:block}
.done circle{stroke:var(--acc);stroke-dasharray:283;stroke-dashoffset:283;animation:draw .8s ease forwards}
.done path{stroke:var(--acc);stroke-dasharray:60;stroke-dashoffset:60;animation:draw .4s .7s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pct{font:400 15px var(--sans);color:var(--acc);font-weight:600}
.quote{font-size:15px}.quote p{margin:10px 0}.who{font-size:13px;color:var(--mute)}
.stars{color:#d9a400;letter-spacing:2px;font-size:15px}
.case img{width:100%;border-radius:6px;display:block;border:1px solid var(--line)}
.case p{margin:8px 0 0;font-size:14px;color:var(--mute)}
.ring{position:relative;width:180px;height:180px;margin:24px auto 8px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:400 58px "Instrument Serif",serif}
.ring small{position:absolute;left:0;bottom:40px;width:100%;text-align:center;color:var(--mute);font-size:12px}
.steps{list-style:none;padding:0;margin:20px 0 0}
.steps li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);color:var(--mute);transition:color .3s}
.steps li i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--onacc)}
.steps li.ok{color:var(--ink)}.steps li.ok i{background:var(--acc);border-color:var(--acc)}
.bars{display:grid;gap:14px;margin-top:10px}
.bar .t{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.bar .tr{height:8px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--acc);transform-origin:left;animation:grow .9s ease both}
@keyframes grow{from{transform:scaleX(0)}}
.bar.low .tr i{background:var(--warn)}
.flipwrap{perspective:1200px;margin-top:18px}
.flip{position:relative;width:100%;aspect-ratio:1.55;border:0;padding:0;background:transparent;cursor:pointer;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1);display:block;font:inherit;color:inherit}
.flip.open{transform:rotateY(180deg);cursor:default}
.flipwrap{position:relative}
.flip:not(.open){animation:wig 4.5s ease-in-out infinite}
@keyframes wig{0%,78%,100%{transform:rotate(0) scale(1)}82%{transform:rotate(-1.2deg) scale(1.01)}87%{transform:rotate(1.2deg) scale(1.01)}92%{transform:rotate(-.6deg)}96%{transform:rotate(0)}}
.front .tap{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);border-radius:999px;padding:8px 14px;font-weight:600;opacity:1;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{background:rgba(255,255,255,.34)}}
.cf{position:absolute;left:50%;top:50%;border-radius:2px;pointer-events:none;z-index:3;opacity:0;animation:burst 1.9s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y) + 160px)) rotate(var(--r))}}
.back .amt{animation:none}.flip.open .back .amt{animation:pop .6s .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;overflow:hidden}
.front{background:var(--acc);color:var(--onacc)}
.front::after{content:"";position:absolute;right:-40px;bottom:-40px;width:180px;height:180px;border:1px solid currentColor;border-radius:50%;opacity:.25}
.front img{width:40px;height:40px}
.front .tap{font-size:14px;opacity:.85}
.back{transform:rotateY(180deg);background:var(--card);border:1.5px dashed var(--acc)}
.back .amt{font:400 64px/1 "Instrument Serif",serif;color:var(--acc)}
.back .for{font-weight:600;font-size:17px}
.locked{position:relative}.locked .blur{filter:blur(7px);user-select:none;pointer-events:none;max-height:760px;overflow:hidden}
.pay{position:absolute;inset:0;display:grid;place-items:center}
.pay .card{text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.14);margin:0}
.price{font:400 56px "Instrument Serif",serif;line-height:1}
ul.tick{padding:0;list-style:none;text-align:left;margin:14px 0}

ul.tick li::before{content:"";position:absolute;left:4px;top:15px;width:10px;height:6px;border:2px solid var(--acc);border-top:0;border-right:0;transform:rotate(-45deg)}
.pillar{border-top:1px solid var(--line);padding:18px 0}

.plan div{border-top:1px solid var(--line);padding-top:10px}

.pkg{border:1px solid var(--acc);background:var(--accs)}
.eyebrow{font-size:13px;color:var(--acc);font-weight:600;margin:0 0 6px}
.sec{margin-top:44px}
.can{display:grid;gap:12px;margin-top:18px}
.can div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px}
.can svg{width:40px;height:40px;color:var(--acc)}
.can h3{font-size:20px}.can p{margin:4px 0 0;font-size:15px;color:var(--mute)}
.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
.cases figure{margin:0}.cases img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;border-radius:6px;border:1px solid var(--line);display:block}
.cases figcaption{font-size:13px;margin-top:6px;line-height:1.35}.cases figcaption span{display:block;color:var(--mute);font-size:12px}

.revs .card{flex:0 0 86%;scroll-snap-align:start;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px;text-align:center}
.stats b{display:block;font:400 clamp(24px,7.5vw,34px)/1.2 "Instrument Serif","Noto Serif TC",serif;color:var(--acc);white-space:nowrap}
.stats span{font-size:13px;color:var(--mute)}
.cta{background:var(--acc);color:var(--onacc);border:0}
.cta h2 em{color:inherit;opacity:.85}.cta .btn{background:var(--onacc);color:var(--acc)}
.cta .small,.cta label{color:inherit;opacity:.85}.cta .check{color:inherit}
.cta textarea{background:var(--onacc);color:var(--ink)}
.chip{display:inline-block;background:var(--onacc);color:var(--acc);border-radius:4px;padding:4px 10px;font-size:13px;font-weight:600;margin-top:6px}
.spin{width:44px;height:44px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite;margin:10px auto 18px}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.screen,.spin,.bar .tr i,.done circle,.done path{animation:none!important;stroke-dashoffset:0!important}}
[hidden]{display:none!important}
</style>

   <div><b>${t("week")(4)}</b><strong>${t("lock")}</strong> ${L(ACT[top[0].k][2])}${dot}${t("retake")}</div></div></div>
  <div class="card"><h2>${t("all")}</h2>${order.map(p=>`<div class="pillar"><p class="lvl">${L(p.n)} · ${r.sc[p.k]}/100</p><p>${L(TXT[p.k][lvl(r.sc[p.k])])}</p><p class="small">${t("quick")}${ACT[p.k].map(L).join(" · ")}</p></div>`).join("")}</div>
  <div class="card pkg"><p class="eyebrow">${t("pkgh")}</p><h2>Bluluma ${L(pk[0])}</h2><p class="small">${t("pkgp")}</p><ul class="tick">${pk[1].map(x=>`<li>${L(x)}</li>`).join("")}</ul></div>`;
  app.innerHTML=`<section class="screen center">
    <div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="10"/><circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="var(--acc)" stroke-width="10" stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="327"/></svg><b id="num">0</b><small>${t("of100")}</small></div>
    <p class="small">${esc(S.lead.biz||"")} · ${L(r.ind)}</p><h1>${esc(nm[0])}${en()?" ":""}<em>${esc(nm[1])}</em></h1><p class="lead">${L(tr[3])}</p></section>
   <section class="sec"><p class="eyebrow">${t("bonusk")}</p><h2>${t("bonush")}</h2>
    <div class="flipwrap"><button class="flip${S.flipped?" open":""}" id="flip" aria-label="${t("tap")}">
     <div class="face front"><img src="${IB}bluluma-icon-white.svg" alt=""><div><h3 style="color:inherit">${t("bonusfront")}</h3><p class="tap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11V5a2 2 0 0 1 4 0v6"/><path d="M13 9a2 2 0 0 1 4 0v3"/><path d="M17 11a2 2 0 0 1 4 0v4a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3.5L4 15a2 2 0 0 1 3.4-2L9 15"/></svg>${t("tap")}</p></div></div>
     <div class="face back"><div><div class="amt">$300</div><div class="for">${en()?t("off")+" "+L(BONUS[bk]):"抵用券 · 用於你的"+L(BONUS[bk])}</div></div><div class="small">${t("valid")(exp)} ${t("fine")}</div></div>
    </button></div></section>
   <section class="sec"><div class="card cta" id="cta">${S.req?`<h2>${t("done")}</h2><p>${t("donep")(esc(S.lead.email))}</p>${LIVE?"":`<p class="small">${t("demo2")}</p>`}`:`
    ${qual?`<h2>${t("ctah")}</h2><p>${t(hasSite?"ctap1":"ctap0")}</p>${hasSite?`<p class="small">${esc(S.lead.site)}</p>`:""}`:`<h2>${t("ctah2")}</h2><p>${t("ctap2")}</p>`}
    <span class="chip">$300 · ${L(BONUS[bk])}</span><p class="small">${t("ctabonus")} ${t("valid")(exp)}</p>
    <form id="reqform"><label for="notes">${t("notes")}</label><textarea id="notes"></textarea>
    <div style="margin-top:18px"><button class="btn" type="submit">${t(qual?"ctab1":"ctab2")}</button></div><p class="small" id="reqmsg" aria-live="polite"></p></form>
    <p class="small">${t("ctas")}</p>`}</div></section>
   <div class="card"><h3>${t("five")}</h3><div class="bars">${P.map(p=>`<div class="bar${r.sc[p.k]<40?" low":""}"><div class="t"><span>${L(p.n)}</span><b>${r.sc[p.k]}</b></div><div class="tr"><i style="width:${Math.max(r.sc[p.k],3)}%"></i></div></div>`).join("")}</div></div>
   <section class="sec" id="report">${report}</section>
   <section class="sec"><h2>${t("canh")}</h2><p class="lead">${t("canp")}</p>
    <div class="can">${CAN.map(c=>`<div><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[c[0]]}</svg><span><h3>${L(c[1])}</h3><p>${L(c[2])}</p></span></div>`).join("")}</div></section>
   <section class="sec"><div class="stats">${t("stat").map(s=>`<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join("")}</div></section>
   <section class="sec"><h2>${t("caseh")}</h2><p class="small">${t("casep")}</p>
    <div class="cases">${CASES.map(c=>`<figure><img src="${IB}${c[0]}.webp" alt="${c[1]} website" loading="lazy"><figcaption>${c[1]}<span>${L(c[2])}</span></figcaption></figure>`).join("")}</div></section>
   <section class="sec"><h2>${t("revh")}</h2><div class="revs">${REV.map(revCard).join("")}</div></section>
`;
  let n=0;const step=()=>{if(view!=="result")return;n=Math.min(r.total,n+1);$("num").textContent=n;$("arc").style.strokeDashoffset=327-327*n/100;if(n<r.total)requestAnimationFrame(step)};step();
  $("flip").onclick=()=>{if(S.flipped)return;S.flipped=true;save();$("flip").classList.add("open");confetti();setTimeout(dk,1400)};
  const u=$("unlock");if(u)u.onclick=()=>{const pl=PAYLINK[S.lang];
    if(pl&&S.id){location.href=pl+"?client_reference_id="+encodeURIComponent(S.id)+"&prefilled_email="+encodeURIComponent(S.lead.email||"")+(S.lang==="zh"?"&locale=zh-TW":"");return}
    S.paid=true;save();const y=window.scrollY;result();window.scrollTo(0,y)};
  const f=$("reqform");if(f)f.onsubmit=e=>{e.preventDefault();    S.req={at:new Date().toISOString(),notes:$("notes").value.trim(),pkg:pk[0][0],score:r.total,bonus:bk};save();
    if(S.id)api({action:"request",id:S.id,token:S.token,notes:S.req.notes}).catch(()=>{});const y=window.scrollY;result();window.scrollTo(0,y)};
  const dk=()=>dock(S.req||!S.flipped?null:t(qual?"ctab1":"ctab2"),()=>$("cta").scrollIntoView({behavior:"smooth",block:"start"}));dk();
  if(window.ctaObs)ctaObs.disconnect();
  window.ctaObs=new IntersectionObserver(es=>{const v=es[0].isIntersecting;$("dock").style.visibility=v?"hidden":""},{threshold:.15});ctaObs.observe($("cta"));
}
$("back").onclick=()=>{if(view==="lead"){S.i=ALL.length-1;go("quiz")}else if(view==="break"){go("quiz")}else if(view==="quiz"&&S.i>0){S.i--;const b=BREAKS[S.i];if(b){brk=b[0];go("break")}else go("quiz")}else if(view==="quiz")go("intro")};
{const q=new URLSearchParams(location.search),cs=q.get("paid");
 if(cs&&S.lead.email){S.paid=true;save();if(S.id)api({action:"paid",id:S.id,token:S.token,session_id:cs}).catch(()=>{});history.replaceState(null,"",location.pathname);view="result"}
 else if(S.lead.email&&S.a.length>=ALL.length&&S.bonus)view="result"}
$("lang").onclick=()=>{S.lang=en()?"zh":"en";save();if(LIVE)history.replaceState(null,"","/"+S.lang+location.search);draw()};
draw();
}
</script>
</body>
</html>
